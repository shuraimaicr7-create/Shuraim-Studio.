const fontStr=(L,S=1)=>`${L.italic?'italic ':''}${L.weight||400} ${L.size*S}px "${L.font}",system-ui,sans-serif`;
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- Image cache ---------- */
const IMGS=new Map();let onImgReady=()=>{};
function getImg(id){const c=IMGS.get(id);if(c)return c.img&&c.img.complete?c.img:null;IMGS.set(id,{img:null});loadImg(id).then(()=>onImgReady());return null}
async function loadImg(id){const a=await dbGet('assets',id);if(!a){IMGS.set(id,{img:null,missing:true});return null}
  return new Promise(res=>{const url=URL.createObjectURL(a.blob);const im=new Image();im.onload=()=>{IMGS.set(id,{img:im});res(im)};im.onerror=()=>{IMGS.set(id,{img:null,missing:true});res(null)};im.src=url})}
async function preload(doc){const ids=new Set();doc.layers.forEach(l=>{if(l.type==='image'&&l.asset)ids.add(l.asset)});if(doc.bgImage)ids.add(doc.bgImage);await Promise.all([...ids].map(async id=>{if(!(IMGS.get(id)&&IMGS.get(id).img))await loadImg(id)}));
  const fs=new Set(doc.layers.filter(l=>l.type==='text').map(l=>fontStr(l)));await Promise.all([...fs].map(f=>document.fonts.load(f,'Aa').catch(()=>{})))}
const measureCtx=document.createElement('canvas').getContext('2d');

/* ---------- Drawing ---------- */
function rrPath(ctx,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(-w/2+r,-h/2);ctx.arcTo(w/2,-h/2,w/2,h/2,r);ctx.arcTo(w/2,h/2,-w/2,h/2,r);ctx.arcTo(-w/2,h/2,-w/2,-h/2,r);ctx.arcTo(-w/2,-h/2,w/2,-h/2,r);ctx.closePath()}
function gradFor(ctx,c1,c2,ang,w,h,ox=0,oy=0){const a=ang*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a),len=(Math.abs(w*cs)+Math.abs(h*sn))/2;const g=ctx.createLinearGradient(ox-cs*len,oy-sn*len,ox+cs*len,oy+sn*len);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function wrapText(ctx,L,S=1){ctx.font=fontStr(L,S);try{ctx.letterSpacing=(L.spacing||0)*S+'px'}catch(e){}const out=[];(L.text||'').split('\n').forEach(p=>{if(L.curve){out.push(p);return}const words=p.split(' ');let line='';words.forEach(w=>{const t=line?line+' '+w:w;if(line&&ctx.measureText(t).width>L.w*S){out.push(line);line=w}else line=t});out.push(line)});return out}
function drawDoc(ctx,doc,S=1,opt={}){
  ctx.save();ctx.clearRect(0,0,doc.w*S,doc.h*S);
  if(!opt.transparent){ctx.save();ctx.translate(doc.w*S/2,doc.h*S/2);if(doc.bg2){ctx.fillStyle=gradFor(ctx,doc.bg,doc.bg2,doc.bgAngle||0,doc.w*S,doc.h*S)}else ctx.fillStyle=doc.bg||'#fff';ctx.fillRect(-doc.w*S/2,-doc.h*S/2,doc.w*S,doc.h*S);ctx.restore();
    if(doc.bgImage){const im=getImg(doc.bgImage);if(im){const k=Math.max(doc.w/im.width,doc.h/im.height);const sw=doc.w/k,sh=doc.h/k;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,doc.w*S,doc.h*S)}}}
  for(const L of doc.layers){if(L.visible!==false)drawLayer(ctx,L,S)}
  ctx.restore()}
function drawLayer(ctx,L,S){
  if(L.type==='text'){const lines=wrapText(measureCtx,L);L.h=Math.max(L.size*(L.lineH||1.2)*lines.length,L.size)}
  ctx.save();ctx.translate((L.x+L.w/2)*S,(L.y+L.h/2)*S);ctx.rotate((L.rot||0)*Math.PI/180);if(L.flipX)ctx.scale(-1,1);ctx.globalAlpha=clamp(L.opacity??1,0,1);

    if(im){const c=L.crop||{l:0,t:0,r:0,b:0};let sx=im.width*c.l,sy=im.height*c.t,sw=im.width*(1-c.l-c.r),sh=im.height*(1-c.t-c.b);
      if(sw<4)sw=4;if(sh<4)sh=4;const ba=w/h,sa=sw/sh;if(sa>ba){const nw=sh*ba;sx+=(sw-nw)/2;sw=nw}else{const nh=sw/ba;sy+=(sh-nh)/2;sh=nh}
      ctx.save();if(L.mask){const el=ELEMENTS.find(e=>e.id===L.mask);if(L.mask==='rounded')rrPath(ctx,w,h,Math.min(w,h)*.12);else if(el){ctx.translate(-w/2,-h/2);ctx.scale(w/100,h/100);ctx.beginPath();ctx.clip(new Path2D(el.d),el.eo?'evenodd':'nonzero');ctx.scale(100/w,100/h);ctx.translate(w/2,h/2)}if(L.mask==='rounded')ctx.clip()}

function drawText(ctx,L){

const toBlob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
async function renderExport(doc,scale,transparent){await preload(doc);const max=8192;const k=Math.min(scale,max/Math.max(doc.w,doc.h));const c=document.createElement('canvas');c.width=Math.round(doc.w*k);c.height=Math.round(doc.h*k);drawDoc(c.getContext('2d'),doc,k,{transparent});return c}

  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};const obj=(n,s)=>{offs[n]=len;push(`${n} 0 obj\n${s}\nendobj\n`)};
  push('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=len;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>\nstream\n`);push(jb);push('\nendstream\nendobj\n');
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xo=len;push('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}

    const upd=()=>{const k=Math.min(scale,8192/Math.max(d.w,d.h));info.textContent=`${Math.round(d.w*k)} × ${Math.round(d.h*k)} px`+(k<scale?' (limited to 8192 px)':'');qRow.hidden=fmt==='png';trRow.hidden=!(fmt==='png'||fmt==='webp')};

/* ---------- Backup ---------- */
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const dataToBlob=async u=>(await fetch(u)).blob();
async function exportBackup(){toast('Preparing backup…');const out={app:'shuraim-studio',v:1,projects:await dbAll('projects'),brand:BRAND,folders:FOLDERS,assets:[],fonts:[]};
  for(const a of await dbAll('assets'))out.assets.push({...a,blob:await blobToData(a.blob)});for(const f of await dbAll('fonts'))out.fonts.push({...f,blob:await blobToData(f.blob)});
  await saveFile('shuraim-studio-backup.json',JSON.stringify(out))}
async function importBackup(file){try{const o=JSON.parse(await file.text());if(o.app!=='shuraim-studio')throw new Error('Not a Shuraim Studio backup');
  for(const a of o.assets||[])await dbPut('assets',{...a,blob:await dataToBlob(a.blob)});for(const f of o.fonts||[])await dbPut('fonts',{...f,blob:await dataToBlob(f.blob)});
  for(const p of o.projects||[])await dbPut('projects',p);FOLDERS=[...new Set([...FOLDERS,...(o.folders||[])])];await setKV('folders',FOLDERS);
  if(o.brand){BRAND.colors=[...new Set([...BRAND.colors,...(o.brand.colors||[])])];BRAND.logos=[...new Set([...BRAND.logos,...(o.brand.logos||[])])];BRAND.headFont=BRAND.headFont||o.brand.headFont||'';BRAND.bodyFont=BRAND.bodyFont||o.brand.bodyFont||'';await setKV('brand',BRAND)}
